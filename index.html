<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ooredoo Digital Business Cards — Team Directory</title>
<style>
  :root{ --ooredoo-red:#ED1B24; --ink:#2b2b2b; --grey:#6d6d6d; --line:#e7e5e2; }
  *{box-sizing:border-box;}
  body{font-family:'Helvetica Neue',Arial,sans-serif;background:#fafafa;margin:0;color:var(--ink);}
  header{padding:32px 20px 20px;text-align:center;}
  .eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--grey);}
  .eyebrow b{color:var(--ooredoo-red);}
  h1{font-size:20px;margin:8px 0 4px;}
  .sub{font-size:12.5px;color:var(--grey);max-width:480px;margin:0 auto;}
  .grid{max-width:820px;margin:0 auto;padding:8px 16px 60px;display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;}
  .tile{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;text-decoration:none;color:var(--ink);display:block;transition:border-color .15s ease;}
  .tile:hover{border-color:var(--ooredoo-red);}
  .name{font-size:15px;font-weight:700;}
  .title{font-size:12px;color:var(--ooredoo-red);font-weight:600;margin-top:2px;}
  .open{font-size:11px;color:var(--grey);margin-top:10px;}
</style>
</head>
<body>
<header>
  <div class="eyebrow">Spectrum Solutions <b>&middot;</b> Ooredoo Business</div>
  <h1>Digital Business Card Directory</h1>
  <div class="sub">Tap a name to open that person's interactive card — flip to see both sides, or scan the QR straight from the printed card.</div>
</header>
<div class="grid" id="grid"></div>
<script>
  const people = [
    { id:"mvattakary",     name:"Mohammed Musthafa Vattakary", title:"Zone Manager" },
    { id:"sgillani",       name:"Syed Zain Gillani",            title:"Zone Manager" },
    { id:"fmkhan",         name:"Farhan Mohammed Khan",         title:"Zone Manager" },
    { id:"tmohammed",      name:"Turab Ali Mohammed",           title:"Zone Manager" },
    { id:"mhazan",         name:"Munas Mohamed Hazan",          title:"Zone Manager" },
    { id:"sjayachandran",  name:"Sanjay Jayachandran",          title:"Zone Manager" },
    { id:"abawazir",       name:"Rahul Vettikat",               title:"Zone Manager" },
    { id:"rdebnath",       name:"Roni Debnath",                 title:"Account Manager" },
    { id:"ashehzad",       name:"Amer Shehzad",                 title:"Account Manager" },
    { id:"myasir",         name:"Mufas Yasir",                  title:"Account Manager" },
    { id:"rmangadencheri", name:"Rabeeh Mangadencheri",         title:"Zone Manager" },
    { id:"mmuneef",        name:"Muhammed Muneef",              title:"Zone Manager" },
    { id:"jahmed",         name:"Juwel Ahmed",                  title:"Zone Manager" },
  ];
  const grid = document.getElementById('grid');
  people.forEach(p=>{
    const a = document.createElement('a');
    a.className = 'tile';
    a.href = `card.html?id=${p.id}`;
    a.innerHTML = `<div class="name">${p.name}</div><div class="title">${p.title}</div><div class="open">Open card →</div>`;
    grid.appendChild(a);
  });
</script>
</body>
</html>
